<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas SVG</title>
    <style>
        body {
            margin: 30px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>

    <h1></h1>
    <p></p>

    <!-- SVG dimulai di sini -->
    <svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">

        <!-- Garis (Line) -->
        <line x1="20" y1="20" x2="380" y2="20" stroke="blue" stroke-width="2" />

        <!-- Persegi (Rect) -->
        <rect x="50" y="50" width="100" height="100" stroke="green" fill="yellow" stroke-width="2" />

        <!-- Lingkaran (Circle) -->
        <circle cx="200" cy="200" r="50" stroke="red" fill="purple" stroke-width="3" />

        <!-- Elips (Ellipse) -->
        <ellipse cx="300" cy="300" rx="80" ry="40" stroke="orange" fill="pink" stroke-width="2" />

        <!-- Polyline (Garis patah-patah) -->
        <polyline points="50,350 150,300 250,350" stroke="black" fill="none" stroke-width="2" />

        <!-- Polygon (Bentuk bintang) -->
        <polygon 
            points="200,100 220,160 280,160 230,200 250,260 200,220 150,260 170,200 120,160 180,160" 
            stroke="goldenrod" fill="yellow" stroke-width="2" />

    </svg>

</body>
</html>
