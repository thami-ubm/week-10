<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Shapes</title>
</head>
<body>

    <svg width="500" height="200">
        <rect x="20" y="30" width="80" height="130" 
              style="fill:rgb(192, 135, 235);stroke:blue;stroke-width:2;" />

        <circle cx="120" cy="60" r="50" 
                style="fill:rgb(5, 255, 159);stroke:green;stroke-width:2;" />

        <polygon points="245,150 70,120 210,80" 
                 style="fill:salmon;stroke:red;stroke-width:2;" />
    </svg>

    <h1 style="color: aqua; stroke:rgb(93, 21, 165);stroke-width:3";> Cirlce is my Favorite Color!</h1>

</body>
</html>
