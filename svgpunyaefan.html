<body>
    <svg width="500px" height="500px" style="border: black solid 1px">

        <ellipse 
            cx="250" 
            cy="150" 
            rx="150" 
            ry="70"
            style="fill: #bce9bc; stroke: #3ea829; stroke-width: 2;"
        />
        <line 
        x1="50" 
        y1="50" 
        x2="450" 
        y2="100"
        style="stroke: #e21818; stroke-width: 10;"
        />
        <polyline 
        points="100,300 150,350 200,300 250,350 300,300 350,350"
        style="stroke: #0000ff; stroke-width: 4; fill: none;"
        />
        <text 
            x="250" 
            y="450" 
            style="font-size: 50px; fill: #ff6d6d; stroke: black; stroke-width: 2; text-anchor: middle;">
            kelvin kiyowo
        </text>
</svg>
